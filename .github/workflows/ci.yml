name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Python version comes from .python-version; uv installs it if missing.
      - name: Install
        run: uv sync --locked --extra dev --extra llm
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Build the browser version
        run: uv run python -m loosethread.web.build
      - name: Pytest
        run: uv run pytest
        env:
          LOOSETHREAD_WEB_CHECK: "1"  # the Pyodide build must match, not be skipped
      - name: Every table comes from its rows
        run: uv run python -m loosethread.verify
